</style></head><body>
<header><h1>Marketing-to-Revenue Attribution Intelligence<small>Campaign exposure → lead → conversion → revenue · synthetic dataset of 8,000 leads and 10 channels · FY 2025-26</small></h1></header>
<nav id="nav"></nav><main id="view"></main>
<script>
const $=s=>document.querySelector(s);
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(23),gs=()=>Math.sqrt(-2*Math.log(1-R()))*Math.cos(6.283185*R()),cl=(x,a,b)=>Math.max(a,Math.min(b,x)),pk=w=>{let t=R()*w.reduce((a,b)=>a+b),i=0;for(;i<w.length-1&&(t-=w[i])>0;i++);return i};
const fL=v=>Math.abs(v)>=100?'₹'+(v/100).toFixed(2)+' Cr':'₹'+v.toFixed(1)+' L',nf=n=>Math.round(n).toLocaleString('en-IN'),pc=x=>(x*100).toFixed(1)+'%';
// name, spend(₹L), lead weight, MQL rate, quality, CTR, visit→lead
const CH=[['Paid Search',60,.16,.55,1,.04,.06],['Paid Social',45,.17,.35,.7,.012,.05],['Display',30,.14,.25,.5,.004,.03],['Content Syndication',28,.16,.22,.45,.01,.1],['Email',8,.09,.5,.95,.05,.08],['Organic SEO',12,.09,.6,1.1,.03,.05],['Webinars',20,.05,.6,1.25,.06,.12],['Events',40,.04,.65,1.4,.1,.2],['Partner Referral',15,.05,.7,1.6,.15,.25],['Influencer',18,.05,.3,.6,.008,.04]];
const SG=['SMB','Mid-market','Enterprise'],DV=[1.2,4,15],SP=[1,1.05,1.1],WF=[1.1,1,.8],SF=[1.35,1.1,.8,.5],BK=['< 1 hour','1–4 hours','4–24 hours','> 24 hours'];
const LD=[];for(let i=0;i<8000;i++){const m=pk(Array.from({length:12},(_,k)=>1+.07*(k+1))),w=CH.map((c,j)=>c[2]*(j>0&&j<4&&j!=1||j==1?1+.12*(m+1):1)),f=pk(w),t=[f],nt=1+(R()<.55)+(R()<.3)+(R()<.12),w2=CH.map((c,j)=>c[2]*(j==4||j==5?2.5:j==0?1.5:1));
for(let a=1;a<nt;a++)t.push(pk(w2));const q=CH[f][4],u=R(),en=cl(.02+.09*q,.03,.2),sg=u<en?2:u<en+.3?1:0,hrs=Math.exp(gs()*1.1+Math.log(6))*(f==2||f==3?1.8:1),sb=hrs<1?0:hrs<4?1:hrs<24?2:3,tf=1+.08*(nt-1);
const mql=R()<CH[f][3],sql=mql&&R()<cl(.5*Math.pow(q,.6)*SF[sb]*SP[sg]*tf,.03,.85),opp=sql&&R()<cl(.6*Math.pow(q,.5)*tf,.05,.9),won=opp&&R()<cl(.3*Math.pow(q,.5)*WF[sg],.03,.7);
LD.push({m,t,f,sg,hrs,sb,mql,sql,opp,won,val:won?DV[sg]*Math.exp(gs()*.4)*(.8+.2*q):0})}
const ST=['L','mql','sql','opp','won'],SN=['Leads','MQL','SQL','Opportunity','Won'];
const AG=CH.map(()=>({L:0,mql:0,sql:0,opp:0,won:0,rev:0}));LD.forEach(l=>{const a=AG[l.f];a.L++;a.mql+=l.mql;a.sql+=l.sql;a.opp+=l.opp;a.won+=l.won;a.rev+=l.val});
const TOT={L:0,mql:0,sql:0,opp:0,won:0,rev:0};AG.forEach(a=>{for(const k in TOT)TOT[k]+=a[k]});const SPEND=CH.reduce((a,c)=>a+c[1],0);
const MD=[['First touch',n=>t=>t.map((_,i)=>i==0?1:0)],['Last touch',n=>t=>t.map((_,i)=>i==t.length-1?1:0)],['Linear',n=>t=>t.map(()=>1/t.length)],['Position-based',n=>t=>{const L=t.length;return L==1?[1]:L==2?[.5,.5]:t.map((_,i)=>i==0||i==L-1?.4:.2/(L-2))}],['Time-decay',n=>t=>{const w=t.map((_,i)=>Math.pow(2,i)),s=w.reduce((a,b)=>a+b);return w.map(x=>x/s)}]];
const ATT=MD.map(m=>{const r=CH.map(()=>0);LD.forEach(l=>{if(!l.won)return;const w=m[1]()(l.t);l.t.forEach((c,i)=>r[c]+=l.val*w[i])});return r});
const TR=[['Lead → MQL',0,1],['MQL → SQL',1,2],['SQL → Opportunity',2,3],['Opportunity → Won',3,4]],rt=(a,t)=>a[ST[t[2]]]/Math.max(1,a[ST[t[1]]]);
function leaks(){const o=[];TR.forEach((t,ti)=>{const r=AG.map(a=>rt(a,t)),b=[...r].sort((x,y)=>y-x)[2];AG.forEach((a,c)=>{const gap=b-r[c];if(gap<=.005)return;let d=1;for(let j=ti+1;j<4;j++)d*=rt(a,TR[j]);o.push({c,t:t[0],ti,r:r[c],b,gap,val:gap*a[ST[t[1]]]*d*a.rev/Math.max(1,a.won)})})});return o.sort((x,y)=>y.val-x.val)}
const LK=leaks(),LKT=LK.reduce((a,x)=>a+x.val,0),Q=[0,1,2,3].map(q=>{const l=LD.filter(x=>Math.floor(x.m/3)==q);return{L:l.length,rev:l.reduce((a,x)=>a+x.val,0),won:l.filter(x=>x.won).length}});
const romi=(r,c)=>r/CH[c][1],cacL=c=>CH[c][1]/Math.max(1,AG[c].won);
function bars(rows,fmt,max){max=max||Math.max(...rows.map(r=>r[1]));return rows.map(r=>`<div class=br><span>${r[0]}</span><div class=bt><i style="width:${Math.max(0,r[1])/max*100}%;background:${r[2]||'var(--acc)'}"></i></div><b>${fmt(r[1],r)}</b></div>`).join('')}
const T=[['ov','Overview'],['fn','Funnel'],['at','Attribution'],['lk','Leakage diagnostics'],['sc','Scenario lab'],['ag','AI agent'],['br','Problem brief']];
let tab=(location.hash||'#ov').slice(1);if(!T.some(t=>t[0]==tab))tab='ov';
function go(t){tab=t;location.hash=t;nav();V[t]()}
function nav(){$('#nav').innerHTML=T.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('')}
const kp=(b,s,c)=>`<div class="card kpi"><span>${s}</span><b class="${c||''}">${b}</b></div>`;
const V={
ov(){const li=Q.map(q=>q.L/Q[0].L*100),ri=Q.map(q=>q.rev/Q[0].rev*100),X=i=>40+i*105,Y=v=>150-(v-80)/110*130;
$('#view').innerHTML=`<div class="g k">${kp(fL(SPEND),'Marketing spend')}${kp(nf(TOT.L),'Leads generated')}${kp('₹'+nf(SPEND*1e5/TOT.L),'Cost per lead')}${kp(fL(TOT.rev),'Revenue won')}${kp(nf(TOT.won),'Deals won')}${kp(pc(TOT.won/TOT.L),'Lead → won rate','bad')}${kp(fL(SPEND/TOT.won),'Blended CAC')}${kp((TOT.rev/SPEND).toFixed(1)+'x','Return on marketing spend')}</div>
<div class="g c2" style="margin-top:14px"><div class=card><h3>The paradox: leads up, revenue lagging</h3><p class=sub>Quarterly index by lead-creation cohort (Q1 = 100)</p><svg viewBox="0 0 440 180" style="width:100%">${[100,150,200].map(v=>`<line x1=30 x2=430 y1=${Y(v)} y2=${Y(v)} stroke="var(--line)"/><text x=4 y=${Y(v)+3} font-size=9 fill="var(--mut)">${v}</text>`).join('')}
<polyline fill=none stroke="var(--mut)" stroke-width=2.5 points="${li.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/><polyline fill=none stroke="var(--acc)" stroke-width=2.5 points="${ri.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>
${li.map((v,i)=>`<text x=${X(i)} y=${Y(v)-7} font-size=10 text-anchor=middle fill="var(--mut)">${v.toFixed(0)}</text><text x=${X(i)} y=${Y(ri[i])+14} font-size=10 text-anchor=middle fill="var(--acc)">${ri[i].toFixed(0)}</text><text x=${X(i)} y=172 font-size=10 text-anchor=middle fill="var(--mut)">Q${i+1}</text>`).join('')}</svg><p class=sub><span style="color:var(--mut)">━</span> Leads &nbsp; <span style="color:var(--acc)">━</span> Revenue</p></div>
<div class=card><h3>Lead → won rate by quarter</h3><p class=sub>Quality is diluting as lead volume grows</p>${bars(Q.map((q,i)=>['Q'+(i+1),q.won/q.L,i==3?'var(--bad)':'var(--acc)']),pc)}<p>Q4 leads are <b>${(li[3]-100).toFixed(0)}%</b> above Q1, revenue only <b>${(ri[3]-100).toFixed(0)}%</b>. The growth is concentrated in low-quality channels (Paid Social, Display, Content Syndication).</p></div>
<div class=card><h3>Share of leads vs share of revenue</h3><p class=sub>First-touch source</p>${bars(CH.map((c,i)=>[c[0],AG[i].L/TOT.L,'var(--mut)']),pc,.25)}<hr style="border:0;border-top:1px solid var(--line)">${bars(CH.map((c,i)=>[c[0],AG[i].rev/TOT.rev,'var(--acc)']),pc,.25)}</div>
<div class=card><h3>Headline insight</h3><p>The funnel is not leaking evenly. Estimated <b>${fL(LKT)}</b> of recoverable revenue sits in the gap between each channel and best-in-class conversion, equal to <b>${pc(LKT/TOT.rev)}</b> of current revenue.</p><div class=quote>Biggest hotspot: <b>${CH[LK[0].c][0]}</b> at <b>${LK[0].t}</b> (${pc(LK[0].r)} vs ${pc(LK[0].b)} benchmark) worth ${fL(LK[0].val)}.</div><p class=sub>Open Leakage diagnostics for the ranked list.</p></div></div>`},
fn(){$('#view').innerHTML=`<div class=card><div class=row style="margin-bottom:10px"><select id=fc><option value=-1>All channels</option>${CH.map((c,i)=>`<option value=${i}>${c[0]}</option>`).join('')}</select><select id=fs><option value=-1>All segments</option>${SG.map((s,i)=>`<option value=${i}>${s}</option>`).join('')}</select></div><div id=fo></div></div>`;
const u=()=>{const c=+$('#fc').value,s=+$('#fs').value,l=LD.filter(x=>(c<0||x.f==c)&&(s<0||x.sg==s)),n=ST.map(k=>l.filter(x=>k=='L'||x[k]).length),rev=l.reduce((a,x)=>a+x.val,0);let rows=[];
if(s<0){const cs=c<0?CH.map((_,i)=>i):[c],vis=cs.reduce((a,i)=>a+AG[i].L/CH[i][6],0),im=cs.reduce((a,i)=>a+AG[i].L/CH[i][6]/CH[i][5],0);rows.push(['Impressions',im],['Site visits',vis])}
SN.forEach((x,i)=>rows.push([x,n[i]]));const mx=rows[0][1];
$('#fo').innerHTML=bars(rows.map((r,i)=>[r[0],r[1],i>=rows.length-1?'var(--good)':'var(--acc)']),(v,r)=>{const i=rows.findIndex(z=>z[0]==r[0]);return nf(v)+(i?` (${pc(v/rows[i-1][1])})`:'')},mx).replace(/grid-template-columns:130px/g,'grid-template-columns:130px')+`<p class=sub style="margin-top:12px">Percentages show conversion from the previous stage. Revenue won in this view: <b>${fL(rev)}</b> · average deal ${n[4]?fL(rev/n[4]):'—'}.</p>`};$('#fc').onchange=$('#fs').onchange=u;u()},
at(){$('#view').innerHTML=`<div class=card><div class=row style="margin-bottom:10px;align-items:center"><span class=sub style="margin:0">Attribution model</span><select id=am>${MD.map((m,i)=>`<option value=${i}>${m[0]}</option>`).join('')}</select></div><div id=ao></div></div>`;
const u=()=>{const m=+$('#am').value,r=ATT[m],sw=CH.map((_,i)=>[i,ATT[1][i]-ATT[0][i]]).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]))[0];
$('#ao').innerHTML=`<div class="g c2"><div>${bars(CH.map((c,i)=>[c[0],r[i]]),v=>fL(v))}</div><div class=wrap><table><tr><th>Channel</th><th class=n>Spend</th><th class=n>Attributed</th><th class=n>ROMI</th><th class=n>CAC (1st touch)</th></tr>${CH.map((c,i)=>`<tr><td>${c[0]}</td><td class=n>${fL(c[1])}</td><td class=n>${fL(r[i])}</td><td class=n><b class="${romi(r[i],i)<2?'bad':romi(r[i],i)>5?'good':''}">${romi(r[i],i).toFixed(1)}x</b></td><td class=n>${fL(cacL(i))}</td></tr>`).join('')}</table></div></div><p class=sub style="margin-top:12px">Biggest model disagreement: <b>${CH[sw[0]][0]}</b> earns ${fL(ATT[0][sw[0]])} on first touch but ${fL(ATT[1][sw[0]])} on last touch (${sw[1]>0?'closing':'opening'} channel). Judging channels by a single model misallocates budget, so compare models before cutting or scaling.</p>`};$('#am').onchange=u;u()},
lk(){const sp=[0,1,2,3].map(b=>{const m=LD.filter(l=>l.mql&&l.sb==b);return[BK[b],m.filter(l=>l.sql).length/Math.max(1,m.length),m.length]});
$('#view').innerHTML=`<div class="g c2"><div class=card><h3>Ranked leakage hotspots</h3><p class=sub>Revenue recoverable if a channel reached the third-best channel rate at that stage. Total <b>${fL(LKT)}</b>.</p><div class=wrap><table><tr><th>Channel</th><th>Stage</th><th class=n>Now</th><th class=n>Bench</th><th class=n>Recoverable</th></tr>${LK.slice(0,10).map(x=>`<tr><td>${CH[x.c][0]}</td><td>${x.t}</td><td class="n bad">${pc(x.r)}</td><td class=n>${pc(x.b)}</td><td class=n><b>${fL(x.val)}</b></td></tr>`).join('')}</table></div></div>
<div class=card><h3>Speed-to-lead effect</h3><p class=sub>MQL → SQL conversion by response time</p>${bars(sp.map((s,i)=>[s[0],s[1],i<2?'var(--good)':i==2?'var(--warn)':'var(--bad)']),(v,r)=>pc(v),.7)}<p>${pc(LD.filter(l=>l.mql&&l.sb>=2).length/LD.filter(l=>l.mql).length)} of MQLs wait more than 4 hours, and they convert at roughly half the rate of leads handled within an hour.</p></div></div>
<div class=card style="margin-top:14px"><h3>Conversion heatmap: channel × stage</h3><p class=sub>Green = at or above benchmark, red = below</p><div class=wrap><table class=hm><tr><th>Channel</th>${TR.map(t=>`<th>${t[0]}</th>`).join('')}</tr>${CH.map((c,i)=>`<tr><td>${c[0]}</td>${TR.map(t=>{const r=rt(AG[i],t),b=[...AG.map(a=>rt(a,t))].sort((x,y)=>y-x)[2],d=(r-b)/b;return`<td style="background:${d>=0?'rgba(46,166,107,':'rgba(229,72,77,'}${Math.min(.55,Math.abs(d)*.9)})">${pc(r)}</td>`}).join('')}</tr>`).join('')}</table></div></div>`},
sc(){const sl=[['sf','Slow responses (>4h) fixed to <1h (%)',100,0],['op','SQL → Opportunity improvement (pts)',15,0],['wn','Opportunity → Won improvement (pts)',15,0],['mv','Budget moved (% of source channel)',60,0]];
$('#view').innerHTML=`<div class="g c2"><div class=card><h3>Scenario lab</h3><p class=sub>Combine levers and see projected revenue. Budget moves follow diminishing returns (revenue ∝ spend^0.6).</p><label class=sub>Move budget from</label><br><select id=sa>${CH.map((c,i)=>`<option value=${i}${i==2?' selected':''}>${c[0]}</option>`).join('')}</select> <label class=sub>to</label> <select id=sb>${CH.map((c,i)=>`<option value=${i}${i==8?' selected':''}>${c[0]}</option>`).join('')}</select>${sl.map(s=>`<div class=sl><label>${s[1]}<b id=v_${s[0]}>0</b></label><input type=range id=r_${s[0]} min=0 max=${s[2]} value=${s[3]}></div>`).join('')}</div><div class=card id=so></div></div>`;
window.SC=(o)=>{const v={};sl.forEach(s=>v[s[0]]=+$('#r_'+s[0]).value);const a=+$('#sa').value,b=+$('#sb').value,mv=CH[a][1]*v.mv/100;
let r1=0;AG.forEach((x,i)=>{const s2=CH[i][1]+(i==a?-mv:0)+(i==b&&a!=b?mv:0);r1+=x.rev*Math.pow(s2/CH[i][1],.6)});
const R0=TOT.rev,sg=LD.filter(l=>l.won&&l.sb>=2).reduce((s,l)=>s+l.val*(1.35/SF[l.sb]-1),0)*v.sf/100/R0,f2=1+v.op/100/(TOT.opp/TOT.sql),f3=1+v.wn/100/(TOT.won/TOT.opp);
const r2=r1*(1+sg),r3=r2*f2*f3;return{v,R0,r1,r2,r3}};
const u=()=>{const o=SC();sl.forEach(s=>$('#v_'+s[0]).textContent=o.v[s[0]]);$('#so').innerHTML=`<h3>Projected annual revenue</h3>${bars([['Baseline',o.R0,'var(--mut)'],['Scenario',o.r3,'var(--good)']],fL,Math.max(o.R0,o.r3))}<div class="g k" style="margin-top:14px"><div class=kpi><span>Revenue uplift</span><b class=good>${fL(o.r3-o.R0)}</b></div><div class=kpi><span>Uplift %</span><b class=good>${((o.r3/o.R0-1)*100).toFixed(1)}%</b></div><div class=kpi><span>New ROMI</span><b>${(o.r3/SPEND).toFixed(1)}x</b></div></div><table style="margin-top:12px"><tr><th>Lever</th><th class=n>Contribution</th></tr><tr><td>Budget reallocation</td><td class=n>${fL(o.r1-o.R0)}</td></tr><tr><td>Speed-to-lead</td><td class=n>${fL(o.r2-o.r1)}</td></tr><tr><td>Sales conversion</td><td class=n>${fL(o.r3-o.r2)}</td></tr></table><p class=sub style="margin-top:10px">Spend stays constant. Speed and sales levers assume current process capacity can be improved; validate with pilots.</p>`};document.querySelectorAll('#view input,#view select').forEach(e=>e.oninput=u);u()},
ag(){$('#view').innerHTML=`<div class="g c2"><div class=card><h3>Revenue attribution agent</h3><p class=sub>Ask where the funnel loses value and what to do about it.</p><div class=chat id=ch></div><div class=qs>${['Where is the funnel losing value?','Which channels should we cut?','Why is revenue not growing with leads?','Does response time matter?','How do attribution models differ?','Give me a fix plan','Move 30% from Display to Partner Referral'].map(q=>`<button onclick="ask('${q}')">${q}</button>`).join('')}</div><div class=row><input type=text id=qi placeholder="e.g. how is Events performing?"><button class="btn p" onclick="ask()">Ask</button></div></div>
<div class=card><h3>Priority actions</h3><p class=sub>Auto-ranked by recoverable revenue</p><ol>${LK.slice(0,5).map(x=>`<li><b>${CH[x.c][0]}</b>: fix ${x.t} (${pc(x.r)} → ${pc(x.b)}), worth ${fL(x.val)}</li>`).join('')}</ol><p class=sub>Channel scorecard (ROMI, linear model)</p>${bars(CH.map((c,i)=>[c[0],romi(ATT[2][i],i),romi(ATT[2][i],i)<2?'var(--bad)':'var(--acc)']),v=>v.toFixed(1)+'x')}</div></div>`;
$('#qi').onkeydown=e=>{if(e.key=='Enter')ask()};say('a','Hello, I am your marketing analytics agent. Revenue is '+fL(TOT.rev)+' from '+nf(TOT.L)+' leads. Ask me where value is being lost.')},
br(){$('#view').innerHTML=`<div class="g c2"><div class=card><h3>The problem</h3><p>Marketing reports strong lead numbers, yet revenue grows far more slowly. Without a connected view of the journey (campaign exposure, lead capture, qualification, sales conversion and revenue) nobody can see which stage, channel or process is destroying value.</p><h3>The ask</h3><ul><li><b>Trace</b> each customer from first campaign exposure to closed revenue.</li><li><b>Attribute</b> revenue fairly across multiple touchpoints.</li><li><b>Diagnose</b> where the funnel leaks, and what each leak costs.</li><li><b>Recommend</b> reallocation and process fixes, with projected impact.</li></ul></div>
<div class=card><h3>Solution architecture</h3><ul><li><b>Data layer:</b> ad platforms, web analytics, CRM (leads, opportunities, deals) joined by lead ID into journeys.</li><li><b>Funnel engine:</b> stage conversion by channel and segment.</li><li><b>Attribution engine:</b> first, last, linear, position-based and time-decay models.</li><li><b>Leakage model:</b> gap to benchmark × volume × downstream value per stage.</li><li><b>Scenario engine:</b> diminishing-returns budget shifts plus speed and win-rate levers.</li><li><b>Agent:</b> natural-language access to all of the above.</li></ul></div>
<div class=card><h3>Assumed data</h3><div class=wrap><table><tr><th>Source</th><th>Fields</th></tr><tr><td>Ad platforms</td><td>spend, impressions, clicks by channel</td></tr><tr><td>Web analytics</td><td>visits, touchpoint sequence</td></tr><tr><td>CRM</td><td>lead created, response time, MQL/SQL/opportunity/won, deal value, segment</td></tr></table></div></div>
<div class=card><h3>Caveats</h3><ul><li>Data is synthetic and built with deliberate leaks (low-quality channels, slow response), so findings show the method only.</li><li>Attribution models are rules of thumb, not proof of causation. Confirm with holdout or geo experiments.</li><li>Scenario effects assume additive, stable relationships; pilot before scaling.</li><li>Recoverable revenue is an upper bound: it assumes reaching top-tier conversion.</li></ul></div></div>`}};
function say(w,h){const c=$('#ch');c.insertAdjacentHTML('beforeend',`<div class="m ${w}">${h}</div>`);c.scrollTop=c.scrollHeight}
function ask(q){q=q||$('#qi').value.trim();if(!q)return;$('#qi').value='';say('u',q);say('a','<i>Analysing…</i>');setTimeout(()=>{$('#ch').lastChild.remove();say('a',agent(q))},350)}
const KC={search:0,social:1,display:2,syndic:3,email:4,seo:5,organic:5,webinar:6,event:7,partner:8,referral:8,influenc:9};
function agent(q){const t=q.toLowerCase(),hits=Object.keys(KC).map(k=>[t.indexOf(k),KC[k]]).filter(h=>h[0]>=0).sort((a,b)=>a[0]-b[0]).filter((h,i,a)=>a.findIndex(z=>z[1]==h[1])==i),num=(t.match(/(\d+)/)||[])[1];
if(/move|shift|reallocat/.test(t)&&hits.length>=2&&num){const a=hits[0][1],b=hits[1][1],mv=CH[a][1]*Math.min(100,+num)/100,s=(i,x)=>AG[i].rev*Math.pow((CH[i][1]+x)/CH[i][1],.6)-AG[i].rev,d=s(a,-mv)+s(b,mv);return`Moving <b>${num}%</b> of ${CH[a][0]} budget (${fL(mv)}) to ${CH[b][0]}: ${CH[a][0]} revenue changes by <b class=bad>${fL(s(a,-mv))}</b>, ${CH[b][0]} by <b class=good>${fL(s(b,mv))}</b>. Net <b class="${d>=0?'good':'bad'}">${fL(d)}</b> at the same total spend.`}
if(hits.length&&!/attribut|model/.test(t)){const c=hits[0][1],a=AG[c];return`<b>${CH[c][0]}</b>: spend ${fL(CH[c][1])}, ${nf(a.L)} leads (${pc(a.L/TOT.L)}), ${nf(a.won)} wins, revenue ${fL(a.rev)}. Conversion: MQL ${pc(rt(a,TR[0]))}, SQL ${pc(rt(a,TR[1]))}, Opp ${pc(rt(a,TR[2]))}, Win ${pc(rt(a,TR[3]))}. Cost per lead ₹${nf(CH[c][1]*1e5/a.L)}, CAC ${fL(cacL(c))}, ROMI ${romi(a.rev,c).toFixed(1)}x (linear: ${romi(ATT[2][c],c).toFixed(1)}x). ${LK.filter(x=>x.c==c).length?'Top leak: <b>'+LK.filter(x=>x.c==c)[0].t+'</b>, worth '+fL(LK.filter(x=>x.c==c)[0].val)+'.':'No major leak vs benchmark.'}`}
if(/cut|stop|worst|underperform|waste/.test(t)){const w=CH.map((c,i)=>[i,romi(ATT[2][i],i)]).sort((a,b)=>a[1]-b[1]).slice(0,3);return`Lowest ROMI (linear attribution): ${w.map(x=>`<b>${CH[x[0]][0]}</b> ${x[1].toFixed(1)}x`).join(', ')}. Do not simply cut: first fix qualification and follow-up there. If it stays below 2x, move budget to higher-ROMI channels such as ${CH[CH.map((c,i)=>[i,romi(ATT[2][i],i)]).sort((a,b)=>b[1]-a[1])[0][0]][0]}, remembering returns diminish as spend grows.`}
if(/why|growth|grow|trend|paradox|not growing/.test(t)){const li=Q[3].L/Q[0].L-1,ri=Q[3].rev/Q[0].rev-1;return`From Q1 to Q4, leads grew <b>${pc(li)}</b> but revenue only <b>${pc(ri)}</b>. Lead → won fell from ${pc(Q[0].won/Q[0].L)} to ${pc(Q[3].won/Q[3].L)}. The extra volume came from Paid Social, Display and Content Syndication, which have the weakest MQL rate and the longest response delays.`}
if(/speed|response|slow|sla/.test(t)){const g=LD.filter(l=>l.mql&&l.sb<2),s=LD.filter(l=>l.mql&&l.sb>=2);return`MQLs answered within 4 hours convert to SQL at <b>${pc(g.filter(l=>l.sql).length/g.length)}</b> versus <b>${pc(s.filter(l=>l.sql).length/s.length)}</b> when slower. ${pc(s.length/(s.length+g.length))} of MQLs are slow. Fixing all slow responses is worth about <b class=good>${fL(LD.filter(l=>l.won&&l.sb>=2).reduce((a,l)=>a+l.val*(1.35/SF[l.sb]-1),0))}</b> a year.`}
if(/attribut|model|first|last|touch/.test(t)){const d=CH.map((c,i)=>[i,ATT[0][i],ATT[1][i]]).sort((a,b)=>Math.abs(b[1]-b[2])-Math.abs(a[1]-a[2])).slice(0,3);return`Models disagree most for: ${d.map(x=>`<b>${CH[x[0]][0]}</b> (first ${fL(x[1])} vs last ${fL(x[2])})`).join('; ')}. First-touch favours discovery channels, last-touch favours closers such as Email and Organic. Use position-based or linear for budget decisions and confirm with experiments.`}
if(/segment|enterprise|smb|mid/.test(t)){return SG.map((s,i)=>{const l=LD.filter(x=>x.sg==i);return`<b>${s}</b>: ${nf(l.length)} leads, ${l.filter(x=>x.won).length} wins (${pc(l.filter(x=>x.won).length/l.length)}), revenue ${fL(l.reduce((a,x)=>a+x.val,0))}`}).join('<br>')}
if(/plan|fix|recommend|action|improve|priorit/.test(t)){return`Recommended plan:<ol><li><b>Fix speed-to-lead:</b> route MQLs to sales within 1 hour. Open Scenario lab to size it.</li><li><b>Repair top leaks:</b> ${LK.slice(0,3).map(x=>`${CH[x.c][0]} at ${x.t} (${fL(x.val)})`).join('; ')}.</li><li><b>Rebalance budget</b> from low-ROMI channels to Partner Referral, Events and Webinars, in steps, watching diminishing returns.</li><li><b>Align marketing and sales on MQL quality</b>, so volume is not the headline metric.</li></ol>`}
if(/funnel|leak|lose|losing|drop|where/.test(t)){const rows=['Leads','MQL','SQL','Opportunity','Won'].map((n,i)=>[n,TOT[ST[i]]]),dr=rows.slice(1).map((r,i)=>[rows[i][0]+' → '+r[0],r[1]/rows[i][1]]);return`Overall funnel: ${rows.map(r=>r[0]+' '+nf(r[1])).join(' → ')}. Biggest drop is <b>${dr.sort((a,b)=>a[1]-b[1])[0][0]}</b> (${pc(dr[0][1])} converts). Top hotspots: ${LK.slice(0,3).map(x=>`<b>${CH[x.c][0]}</b> at ${x.t} (${fL(x.val)})`).join('; ')}. Total recoverable: <b>${fL(LKT)}</b>.`}
if(/cost|cac|cpl|spend/.test(t))return`Spend ${fL(SPEND)}; cost per lead ₹${nf(SPEND*1e5/TOT.L)}; blended CAC ${fL(SPEND/TOT.won)}; ROMI ${(TOT.rev/SPEND).toFixed(1)}x. Cheap leads are not cheap customers: Content Syndication CPL is low but its CAC is ${fL(cacL(3))} versus ${fL(cacL(8))} for Partner Referral.`;
return'Try asking: <b>where is the funnel losing value</b>, <b>why revenue is not growing</b>, about a channel (e.g. “how is Events performing?”), <b>response time</b>, <b>attribution models</b>, a <b>fix plan</b>, or a what-if such as “move 30% from Display to Partner Referral”.'}
nav();V[tab]();
